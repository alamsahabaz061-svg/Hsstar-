
name: Build HSSTAR APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build HSSTAR Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name "sdkmanager" -print -quit)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found!"
            exit 1
          fi

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android Licenses
        run: |
          set +o pipefail
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
          set -o pipefail

      - name: Install Android SDK Packages
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract HSSTAR Project ZIP
        run: |
          ZIP_FILE="HSSTAR-Android-v1.1-KOTLIN-FIX.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: HSSTAR ZIP not found!"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/hsstar-source"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/hsstar-source"

      - name: Detect Android Project
        run: |
          PROJECT_FILE=$(find "$GITHUB_WORKSPACE/hsstar-source" \
            -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: settings.gradle not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          if [ ! -f "$PROJECT_DIR/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "ERROR: Project build.gradle missing!"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: App build.gradle missing!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build HSSTAR Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon clean assembleDebug

      - name: Verify APK File
        run: |
          APK_PATH=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK file not found!"
            exit 1
          fi

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "APK Found: $APK_PATH"

      - name: Upload HSSTAR APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HSSTAR-APK-Download
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30
          
